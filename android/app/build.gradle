plugins { id 'com.android.application' }
android {
    namespace 'com.lancinema.app'
    compileSdk 36
    defaultConfig { applicationId 'com.lancinema.app'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.1.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def keyPath = System.getenv('LAN_CINEMA_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('LAN_CINEMA_STORE_PASSWORD')
                keyAlias System.getenv('LAN_CINEMA_KEY_ALIAS') ?: 'lancinema'
                keyPassword System.getenv('LAN_CINEMA_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('LAN_CINEMA_KEYSTORE')) signingConfig signingConfigs.release } }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/assets'))
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
}
tasks.register('syncWebAssets', Sync) {
    from '../../static'
    include 'index.html', 'app.js', 'style.css', 'vue.global.prod.js'
    into layout.buildDirectory.dir('generated/assets/web')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-database:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
